openapi: 3.0.3
info:
  title: BrewLite Coffee Ordering & Store Operations API
  version: 2.0.0
  description: >-
    REST API cho he thong BrewLite (Ass2 NestJS Monorepo `apps/api`), bao gom
    Customer storefront, Loyalty/Vouchers, Mock & ZaloPay Sandbox Payment,
    Bill of Materials (BOM) Inventory, Barista KDS va Admin Portal.
servers:
  - url: http://localhost:3001
    description: Local NestJS API
tags:
  - name: Health
  - name: Auth
  - name: Products
  - name: Orders
  - name: Payments
  - name: Inventory
  - name: Staff
  - name: Customers
paths:
  /health:
    get:
      tags: [Health]
      summary: Kiem tra suc khoe API va ket noi PostgreSQL
      responses:
        '200':
          description: API va DB hoat dong binh thuong
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: up }
        '503':
          description: Ket noi database bi loi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  db: { type: string, example: down }

  /auth/register:
    post:
      tags: [Auth]
      summary: Dang ky tai khoan Customer (Throttle 5 req / 60s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Dang ky thanh cong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Dang nhap lay JWT accessToken (Throttle 5 req / 60s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Dang nhap thanh cong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Lay ho so nguoi dung hien tai kem danh sach voucher ca nhan
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Thong tin user an toan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSafe'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/profile:
    patch:
      tags: [Auth]
      summary: Cap nhat ho so va/hoac doi mat khau
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: Ho so da cap nhat
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/redeem-points:
    post:
      tags: [Auth]
      summary: Doi Hat Vang (loyaltyPoints) lay voucher uu dai
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemPointsDto'
      responses:
        '201':
          description: Doi voucher thanh cong
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/vouchers:
    get:
      tags: [Auth]
      summary: Danh sach voucher cua tai khoan hien tai
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sach UserVoucher
        '401': { $ref: '#/components/responses/Unauthorized' }

  /products:
    get:
      tags: [Products]
      summary: Lay danh sach thuc don kem ton kho BOM va outOfStockSizes
      description: OptionalJwtAuthGuard - includeInactive=true chi co tac dung voi STAFF/ADMIN.
      parameters:
        - in: query
          name: includeInactive
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Danh sach mon boc trong `{ data }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Products]
      summary: Tao mon moi (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDto'
      responses:
        '201': { description: Tao mon thanh cong }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}:
    get:
      tags: [Products]
      summary: Chi tiet mon kem danh sach toppings kha dung
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200':
          description: Chi tiet san pham boc trong `{ data }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Cap nhat thong tin mon (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductDto'
      responses:
        '200': { description: Cap nhat thanh cong }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Xoa hoac vo hieu hoa mon (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa / an mon }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}/visibility:
    patch:
      tags: [Products]
      summary: Bat/tat trang thai mo ban hoac het mon thu cong (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleProductVisibilityDto'
      responses:
        '200': { description: Da cap nhat hien thi }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders:
    post:
      tags: [Orders]
      summary: Tao don hang PENDING va tam giu nguyen vat lieu BOM trong transaction
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderDto'
      responses:
        '201':
          description: Don hang duoc tao o trang thai PENDING (VAT 0%)
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Orders]
      summary: Lay tat ca don hang (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach don hang }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/me:
    get:
      tags: [Orders]
      summary: Lich su don hang cua user dang dang nhap
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach don hang ca nhan }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/barista/queue:
    get:
      tags: [Orders]
      summary: Hang doi pha che Barista KDS (STAFF | ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach don hang dang cho/pha che }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Chi tiet don hang theo ID (Owner hoac STAFF/ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Chi tiet don hang }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Orders]
      summary: Xoa don hang (Owner cho phep voi trang thai hop le hoac ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa don hang }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Chuyen trang thai don hang qua state-machine + CAS version + hoan kho neu CANCELLED
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusDto'
      responses:
        '200': { description: Trang thai da cap nhat }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments:
    post:
      tags: [Payments]
      summary: Thanh toan MockGateway (bi chan 403 o production neu ALLOW_MOCK_PAYMENT=false)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentDto'
      responses:
        '201':
          description: Ket qua xu ly thanh toan (ke ca khi PAYMENT_FAILED tra success=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/zalopay/create:
    post:
      tags: [Payments]
      summary: Tao giao dich ZaloPay Sandbox v2 cho don PENDING/PAYMENT_FAILED
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: integer, minimum: 1 }
      responses:
        '200': { description: URL thanh toan va appTransId }
        '400': { $ref: '#/components/responses/BadRequest' }

  /payments/zalopay/callback:
    post:
      tags: [Payments]
      summary: Webhook IPN tu ZaloPay xac thuc chu ky HMAC-SHA256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, mac]
              properties:
                data: { type: string }
                mac: { type: string }
                type: { type: integer }
      responses:
        '200':
          description: Ket qua IPN theo chuan ZaloPay `{ return_code, return_message }`

  /payments/zalopay/status/{orderId}:
    get:
      tags: [Payments]
      summary: Kiem tra trang thai giao dich ZaloPay cua don hang
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: appTransId
          schema: { type: string }
      responses:
        '200': { description: Trang thai thanh toan don hang }

  /payments/zalopay/confirm:
    post:
      tags: [Payments]
      summary: Gia lap callback thanh cong cho ZaloPay Sandbox (production yeu cau ALLOW_SANDBOX_CONFIRM=true)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: integer, minimum: 1 }
                appTransId: { type: string }
      responses:
        '200': { description: Xac nhan thanh toan sandbox thanh cong }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/zalopay/cancel:
    post:
      tags: [Payments]
      summary: Huy giao dich ZaloPay Sandbox va hoan kho (production yeu cau ALLOW_SANDBOX_CONFIRM=true)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: integer, minimum: 1 }
      responses:
        '200': { description: Huy don va hoan nguyen vat lieu }
        '403': { $ref: '#/components/responses/Forbidden' }

  /inventory/pricing-config:
    get:
      tags: [Inventory]
      summary: Lay cau hinh phu thu size mac dinh (Public)
      responses:
        '200': { description: Cau hinh size S/M/L }

  /inventory/size-pricing:
    patch:
      tags: [Inventory]
      summary: Cap nhat cau hinh gia size S/M/L (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSizePricingDto' }
      responses:
        '200': { description: Cap nhat thanh cong }

  /inventory:
    get:
      tags: [Inventory]
      summary: Tong quan ton kho nguyen vat lieu (STAFF | ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach ton kho }

  /inventory/ingredients:
    get:
      tags: [Inventory]
      summary: Danh sach nguyen vat lieu (STAFF | ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach nguyen vat lieu }
    post:
      tags: [Inventory]
      summary: Them nguyen vat lieu moi (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIngredientDto' }
      responses:
        '201': { description: Tao thanh cong }

  /inventory/ingredients/{id}:
    patch:
      tags: [Inventory]
      summary: Cap nhat nguyen vat lieu (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIngredientDto' }
      responses:
        '200': { description: Cap nhat thanh cong }
    delete:
      tags: [Inventory]
      summary: Xoa nguyen vat lieu (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa }

  /inventory/ingredients/{id}/restock:
    patch:
      tags: [Inventory]
      summary: Nhap kho them nguyen vat lieu va ghi InventoryLog (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestockIngredientDto' }
      responses:
        '200': { description: Nhap kho thanh cong }

  /inventory/ingredients/{id}/stock:
    patch:
      tags: [Inventory]
      summary: Kiem ke dieu chinh ton kho tuyet doi (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIngredientStockDto' }
      responses:
        '200': { description: Dieu chinh thanh cong }

  /inventory/logs:
    get:
      tags: [Inventory]
      summary: Lich su bien dong kho (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach InventoryLog }

  /inventory/recipes:
    get:
      tags: [Inventory]
      summary: Danh sach dinh muc BOM cho mon va topping (STAFF | ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach cong thuc }
    post:
      tags: [Inventory]
      summary: Them hoac cap nhat cong thuc BOM theo productId + size (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertRecipeDto' }
      responses:
        '201': { description: Luu cong thuc thanh cong }

  /inventory/recipes/{id}:
    patch:
      tags: [Inventory]
      summary: Cap nhat dinh muc cong thuc (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRecipeDto' }
      responses:
        '200': { description: Cap nhat thanh cong }
    delete:
      tags: [Inventory]
      summary: Xoa dong cong thuc (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa }

  /inventory/topping-recipes:
    post:
      tags: [Inventory]
      summary: Tao cong thuc topping kem dinh muc nguyen lieu (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateToppingRecipeDto' }
      responses:
        '201': { description: Tao thanh cong }

  /inventory/topping-recipes/{id}:
    patch:
      tags: [Inventory]
      summary: Cap nhat topping recipe (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateToppingRecipeDto' }
      responses:
        '200': { description: Cap nhat thanh cong }
    delete:
      tags: [Inventory]
      summary: Xoa topping recipe (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa }

  /inventory/vouchers:
    get:
      tags: [Inventory]
      summary: Danh sach ma giam gia he thong DiscountCode (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach voucher }
    post:
      tags: [Inventory]
      summary: Tao ma giam gia moi (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVoucherDto' }
      responses:
        '201': { description: Tao thanh cong }

  /inventory/vouchers/{id}:
    patch:
      tags: [Inventory]
      summary: Cap nhat ma giam gia (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVoucherDto' }
      responses:
        '200': { description: Cap nhat thanh cong }
    delete:
      tags: [Inventory]
      summary: Xoa ma giam gia (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa }

  /inventory/dashboard:
    get:
      tags: [Inventory]
      summary: Bao cao doanh thu, loi nhuan gop COGS va canh bao ton kho (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: So lieu dashboard Admin }

  /staff:
    get:
      tags: [Staff]
      summary: Danh sach nhan vien (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach nhan vien }
    post:
      tags: [Staff]
      summary: Tao tai khoan nhan vien (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStaffDto' }
      responses:
        '201': { description: Tao thanh cong }

  /staff/{id}:
    get:
      tags: [Staff]
      summary: Chi tiet nhan vien (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Thong tin nhan vien }
    patch:
      tags: [Staff]
      summary: Cap nhat thong tin nhan vien (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStaffDto' }
      responses:
        '200': { description: Cap nhat thanh cong }
    delete:
      tags: [Staff]
      summary: Xoa nhan vien (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa }

  /staff/{id}/status:
    patch:
      tags: [Staff]
      summary: Khoa / mo khoa tai khoan nhan vien (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleStatusDto' }
      responses:
        '200': { description: Cap nhat thanh cong }

  /admin/customers:
    get:
      tags: [Customers]
      summary: Danh sach khach hang (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach khach hang }
    post:
      tags: [Customers]
      summary: Tao khach hang moi (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerDto' }
      responses:
        '201': { description: Tao thanh cong }

  /admin/customers/{id}:
    get:
      tags: [Customers]
      summary: Chi tiet khach hang (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Thong tin khach hang }
    patch:
      tags: [Customers]
      summary: Cap nhat khach hang (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomerDto' }
      responses:
        '200': { description: Cap nhat thanh cong }
    delete:
      tags: [Customers]
      summary: Xoa khach hang (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa }

  /admin/customers/{id}/status:
    patch:
      tags: [Customers]
      summary: Khoa / mo khoa tai khoan khach hang (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleStatusDto' }
      responses:
        '200': { description: Cap nhat thanh cong }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    NumericId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string }
  responses:
    BadRequest: { description: Du lieu dau vao khong hop le hoac vi pham nghiep vu }
    Unauthorized: { description: Thieu hoac JWT khong hop le }
    Forbidden: { description: Khong du quyen truy cap hoac bi chan theo cau hinh moi truong }
    NotFound: { description: Khong tim thay tai nguyen }
    Conflict: { description: Xung dot trang thai / optimistic locking / trung du lieu }
    TooManyRequests: { description: Vuot gioi han tan suat (ThrottlerGuard) }
  schemas:
    Role:
      type: string
      enum: [CUSTOMER, STAFF, ADMIN]
    OrderStatus:
      type: string
      enum: [PENDING, PAID, PREPARING, READY, COMPLETED, PAYMENT_FAILED, CANCELLED]
    PaymentMethod:
      type: string
      enum: [EWALLET, BANK_CARD]
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED]
    RegisterDto:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        fullName: { type: string }
        phone: { type: string }
    LoginDto:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateProfileDto:
      type: object
      properties:
        fullName: { type: string }
        phone: { type: string }
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 6 }
    RedeemPointsDto:
      type: object
      required: [points]
      properties:
        points: { type: integer, minimum: 1 }
        voucherCode: { type: string, maxLength: 50 }
        description: { type: string, maxLength: 200 }
    UserSafe:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        position: { type: string, nullable: true }
        isActive: { type: boolean }
        loyaltyPoints: { type: integer }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/UserSafe' }
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        basePrice: { type: number }
        sizeUpchargeM: { type: number, nullable: true }
        sizeUpchargeL: { type: number, nullable: true }
        category: { type: string }
        tag: { type: string, nullable: true }
        isActive: { type: boolean }
        isSoldOutManual: { type: boolean }
        outOfStockSizes:
          type: array
          items: { type: string }
    CreateProductDto:
      type: object
      required: [name, basePrice]
      properties:
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        basePrice: { type: number, minimum: 0 }
        sizeUpchargeM: { type: number, minimum: 0, nullable: true }
        sizeUpchargeL: { type: number, minimum: 0, nullable: true }
        category: { type: string }
        tag: { type: string }
        isActive: { type: boolean }
        isSoldOutManual: { type: boolean }
    UpdateProductDto:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        basePrice: { type: number, minimum: 0 }
        sizeUpchargeM: { type: number, minimum: 0, nullable: true }
        sizeUpchargeL: { type: number, minimum: 0, nullable: true }
        category: { type: string }
        tag: { type: string }
        isActive: { type: boolean }
        isSoldOutManual: { type: boolean }
    ToggleProductVisibilityDto:
      type: object
      properties:
        isActive: { type: boolean }
        isSoldOutManual: { type: boolean }
    OrderItemDto:
      type: object
      required: [productId, size, toppings, quantity]
      properties:
        productId: { type: integer, minimum: 1 }
        productName: { type: string }
        size: { type: string, enum: [S, M, L, ALL] }
        sugarLevel: { type: string }
        iceLevel: { type: string }
        temperature: { type: string }
        notes: { type: string }
        toppings:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 50 }
        quantity: { type: integer, minimum: 1, maximum: 50 }
        unitPrice: { type: number, minimum: 0 }
    CreateOrderDto:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderItemDto' }
        discountCode: { type: string }
    UpdateOrderStatusDto:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
    CreatePaymentDto:
      type: object
      required: [orderId, method]
      properties:
        orderId: { type: integer, minimum: 1 }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        simulateFailure: { type: boolean }
    PaymentResponse:
      type: object
      properties:
        success: { type: boolean }
        paymentId: { type: integer }
        orderId: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { type: number }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        transactionId: { type: string }
        pointsEarned: { type: integer }
        isIdempotent: { type: boolean }
        message: { type: string }
    UpdateSizePricingDto:
      type: object
      required: [sizeS, sizeM, sizeL]
      properties:
        sizeS: { type: number, minimum: 0 }
        sizeM: { type: number, minimum: 0 }
        sizeL: { type: number, minimum: 0 }
    CreateIngredientDto:
      type: object
      required: [code, name, unit, stock, minThreshold]
      properties:
        code: { type: string }
        name: { type: string }
        unit: { type: string }
        stock: { type: number, minimum: 0, maximum: 100000000 }
        minThreshold: { type: number, minimum: 0, maximum: 100000000 }
        costPerUnit: { type: number, minimum: 0, maximum: 1000000000 }
        type: { type: string, enum: [INGREDIENT, PACKAGING] }
        isRequiredForSale: { type: boolean }
    UpdateIngredientDto:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        unit: { type: string }
        stock: { type: number, minimum: 0, maximum: 100000000 }
        minThreshold: { type: number, minimum: 0, maximum: 100000000 }
        costPerUnit: { type: number, minimum: 0, maximum: 1000000000 }
        type: { type: string, enum: [INGREDIENT, PACKAGING] }
        isRequiredForSale: { type: boolean }
    RestockIngredientDto:
      type: object
      required: [addAmount]
      properties:
        addAmount: { type: number, minimum: 0.1, maximum: 100000000 }
        unitCost: { type: number, minimum: 0, maximum: 1000000000 }
        totalCost: { type: number, minimum: 0, maximum: 10000000000 }
        note: { type: string }
    UpdateIngredientStockDto:
      type: object
      required: [stock]
      properties:
        stock: { type: number, minimum: 0, maximum: 100000000 }
        minThreshold: { type: number, minimum: 0, maximum: 100000000 }
        costPerUnit: { type: number, minimum: 0, maximum: 1000000000 }
        type: { type: string, enum: [INGREDIENT, PACKAGING] }
        isRequiredForSale: { type: boolean }
        note: { type: string }
    UpsertRecipeDto:
      type: object
      required: [productId, ingredientId, size, amount]
      properties:
        productId: { type: integer }
        ingredientId: { type: integer }
        size: { type: string, enum: [S, M, L, ALL] }
        amount: { type: number, minimum: 0.01 }
    UpdateRecipeDto:
      type: object
      required: [amount]
      properties:
        size: { type: string, enum: [S, M, L, ALL] }
        amount: { type: number, minimum: 0.01 }
    CreateToppingRecipeDto:
      type: object
      required: [toppingId, toppingName, price, ingredientId, amount]
      properties:
        toppingId: { type: string }
        toppingName: { type: string }
        subtext: { type: string }
        price: { type: number, minimum: 0 }
        isActive: { type: boolean }
        ingredientId: { type: integer }
        amount: { type: number, minimum: 0.01 }
    UpdateToppingRecipeDto:
      type: object
      properties:
        toppingName: { type: string }
        subtext: { type: string }
        price: { type: number, minimum: 0 }
        isActive: { type: boolean }
        amount: { type: number, minimum: 0.01 }
    CreateVoucherDto:
      type: object
      required: [code, discountPercent]
      properties:
        code: { type: string }
        description: { type: string }
        discountPercent: { type: number, minimum: 1, maximum: 100 }
        minOrderAmount: { type: number, minimum: 0 }
        maxDiscountAmount: { type: number, minimum: 0 }
        isActive: { type: boolean }
    UpdateVoucherDto:
      type: object
      properties:
        code: { type: string }
        description: { type: string }
        discountPercent: { type: number, minimum: 1, maximum: 100 }
        minOrderAmount: { type: number, minimum: 0 }
        maxDiscountAmount: { type: number, minimum: 0 }
        isActive: { type: boolean }
    ToggleStatusDto:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    CreateStaffDto:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        fullName: { type: string }
        phone: { type: string }
        position: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    UpdateStaffDto:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        fullName: { type: string }
        phone: { type: string }
        position: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
    CreateCustomerDto:
      type: object
      required: [email, fullName]
      properties:
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string }
        password: { type: string }
    UpdateCustomerDto:
      type: object
      properties:
        fullName: { type: string }
        phone: { type: string }
        password: { type: string }
        isActive: { type: boolean }
