openapi: 3.0.3
info:
  title: BrewLite Coffee Ordering & Store Operations API
  version: 2.0.0
  description: >-
    REST API cho he thong BrewLite (Ass2 NestJS Monorepo `apps/api`), bao gom
    Customer storefront, Loyalty/Vouchers, Mock & ZaloPay Sandbox Payment,
    Bill of Materials (BOM) Inventory, Barista KDS va Admin Portal.
    Global rate limit qua ThrottlerGuard: 120 requests / 60s (rieng /auth/register
    va /auth/login gioi han 5 requests / 60s).
servers:
  - url: http://localhost:3001
    description: Local NestJS API
  - url: https://brewlite-api-9viv.onrender.com
    description: Production API (Render Singapore)
tags:
  - name: Health
  - name: Auth
  - name: Products
  - name: Orders
  - name: Payments
  - name: Inventory
  - name: Staff
  - name: Customers
paths:
  /health:
    get:
      tags: [Health]
      summary: Kiem tra suc khoe API va ket noi PostgreSQL
      responses:
        '200':
          description: API va DB hoat dong binh thuong
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: up }
        '503':
          description: Ket noi database bi loi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  db: { type: string, example: down }

  /auth/register:
    post:
      tags: [Auth]
      summary: Dang ky tai khoan Customer (Throttle 5 req / 60s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Dang ky thanh cong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Dang nhap lay JWT accessToken (Throttle 5 req / 60s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Dang nhap thanh cong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Lay ho so nguoi dung hien tai kem danh sach voucher ca nhan dang hoat dong
      description: Loc bo cac UserVoucher co quantity <= 0 hoac lien ket voi DiscountCode dang bi vo hieu hoa (isActive = false).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Thong tin user an toan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSafe'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/profile:
    patch:
      tags: [Auth]
      summary: Cap nhat ho so va/hoac doi mat khau
      description: Neu doi mat khau (newPassword), server tang tokenVersion (+1) de thu hoi token cu va tra ve accessToken moi cung ho so da cap nhat.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: Ho so da cap nhat (kem accessToken moi neu doi mat khau)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/redeem-points:
    post:
      tags: [Auth]
      summary: Doi Hat Vang (loyaltyPoints) lay voucher uu dai theo VOUCHER_CATALOG / DiscountCode
      description: >-
        Quy tac quy doi diem duoc server kiem soat tuyet doi (server-enforced).
        VOUCHER_CATALOG co dinh: BREW10 (10 diem -> giam 10%, toi da 15.000d),
        BREWCOZY (15 diem -> giam 15%, toi da 25.000d), BREW20 (20 diem -> giam 20%,
        toi da 25.000d, don toi thieu 60.000d), WELCOME20 (20 diem -> giam 20%,
        toi da 25.000d, don toi thieu 50.000d), BREW50 (50 diem -> giam 50%,
        toi da 60.000d, don toi thieu 120.000d), hoac ma dang isActive trong bang
        DiscountCode (requiredPoints = max(1, round(discountPercent))).
        Danh sach vouchers tra ve da loc bo cac ma co DiscountCode.isActive = false.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemPointsDto'
      responses:
        '201':
          description: Doi voucher thanh cong va tru diem atomic
        '400':
          description: Khong du diem loyaltyPoints hoac ma voucher khong hop le / da bi vo hieu hoa (isActive = false)
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/vouchers:
    get:
      tags: [Auth]
      summary: Danh sach voucher dang hoat dong cua tai khoan hien tai
      description: Chi tra ve UserVoucher co quantity > 0 va DiscountCode tuong ung khong bi isActive = false.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sach UserVoucher
        '401': { $ref: '#/components/responses/Unauthorized' }

  /products:
    get:
      tags: [Products]
      summary: Lay danh sach thuc don kem ton kho BOM va outOfStockSizes
      description: OptionalJwtAuthGuard - includeInactive=true (hoac '1') chi co tac dung voi STAFF/ADMIN.
      parameters:
        - in: query
          name: includeInactive
          schema: { type: string, enum: ['true', '1', 'false'] }
      responses:
        '200':
          description: Danh sach mon boc trong `{ data }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Products]
      summary: Tao mon moi (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDto'
      responses:
        '201': { description: Tao mon thanh cong }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}:
    get:
      tags: [Products]
      summary: Chi tiet mon kem danh sach toppings kha dung
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200':
          description: Chi tiet san pham boc trong `{ data }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Cap nhat thong tin mon (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductDto'
      responses:
        '200': { description: Cap nhat thanh cong }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Xoa hoac vo hieu hoa mon (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa / an mon }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}/visibility:
    patch:
      tags: [Products]
      summary: Bat/tat trang thai mo ban hoac het mon thu cong (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleProductVisibilityDto'
      responses:
        '200': { description: Da cap nhat hien thi }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}/sold-out:
    patch:
      tags: [Products]
      summary: Bat/tat trang thai het hang thu cong cua mon (86 out-of-stock) - STAFF hoac ADMIN
      description: >-
        Cho phep nhan vien pha che (STAFF) hoac Quan tri vien (ADMIN) danh dau mon da het hang tam thoi
        hoac mo ban lai. Luu y bao mat RBAC: neu nguoi goi co role STAFF, ket qua tra ve se tu dong luoc bo
        toan bo thong tin cong thuc (recipes) va gia von COGS (cogsSizeS, cogsSizeM, cogsSizeL) nham ngan chan ro ri du lieu kinh doanh.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleSoldOutDto'
      responses:
        '200':
          description: Cap nhat trang thai het hang thanh cong (STAFF khong nhan duoc recipes va COGS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    post:
      tags: [Orders]
      summary: Tao don hang PENDING va tam giu nguyen vat lieu BOM trong transaction
      description: >-
        Tao don hang moi o trang thai PENDING (hoac PAID ngay neu totalAmount = 0).
        He thong khoa User bang SELECT ... FOR UPDATE de chong race condition, kiem tra gioi han toi da 5 don hang
        o trang thai PENDING/PAYMENT_FAILED cung luc tren tai khoan.
        Bat buoc san pham/size phai co cong thuc BOM Recipe (requireRecipeForEachItem: true -> 400 neu thieu).
        Ma DiscountCode cong khai yeu cau dang nhap va chi duoc dung toi da 1 don khong huy (status != CANCELLED) moi user;
        UserVoucher cung kiem tra DiscountCode.isActive.
        Ho tro header Idempotency-Key chuan hoa qua normalizeIdempotencyKey (toi da 255 ky tu, tu choi non-string -> 400).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderDto'
      responses:
        '201':
          description: Don hang duoc tao thanh cong o trang thai PENDING (VAT 0%), hoac tra ve don hang da ton tai neu trung Idempotency-Key va trung payload
        '400':
          description: Du lieu khong hop le (thieu Recipe BOM, het nguyen lieu bat buoc, voucher da dung/tat, Idempotency-Key sai dinh dang, hoac vuot gioi han 5 don PENDING/PAYMENT_FAILED)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Xung dot optimistic locking khi tru kho hoac Idempotency-Key payload mismatch
    get:
      tags: [Orders]
      summary: Lay tat ca don hang (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach don hang }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/me:
    get:
      tags: [Orders]
      summary: Lich su don hang cua user dang dang nhap
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach don hang ca nhan }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/barista/queue:
    get:
      tags: [Orders]
      summary: Hang doi pha che Barista KDS (STAFF | ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach don hang dang cho/pha che }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Chi tiet don hang theo ID (Owner hoac STAFF/ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Chi tiet don hang }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Orders]
      summary: Xoa don hang chua thanh toan/da huy (Chi Owner hoac ADMIN; STAFF bi tu choi 403)
      description: Chi chu so huu don hang hoac ADMIN duoc phep xoa don dang o trang thai PENDING, PAYMENT_FAILED hoac CANCELLED (STAFF nhan 403 neu khong phai chu don; muon huy don PAID truoc PREPARING thi STAFF dung PATCH /orders/{id}/status).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa don hang }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Chuyen trang thai don hang qua state-machine + CAS version (cong diem COMPLETED, hoan kho neu CANCELLED)
      description: >-
        Khi chuyen sang COMPLETED, he thong cong diem Hat Vang floor(totalAmount / 1000) cho user va tra ve pointsEarned.
        STAFF va ADMIN duoc phep huy don PAID truoc khi PREPARING (hoan 100% BOM + voucher ma khong thu hoi diem chua cong).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusDto'
      responses:
        '200': { description: Trang thai da cap nhat (kem pointsEarned neu chuyen sang COMPLETED) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments:
    post:
      tags: [Payments]
      summary: Thanh toan MockGateway (bi chan 403 o production neu ALLOW_MOCK_PAYMENT=false)
      description: Chuyen don sang PAID va ghi nhan Payment (pointsEarned = 0 tai buoc PAID; diem Hat Vang duoc cong khi don dat COMPLETED). Ho tro Idempotency-Key chuan hoa qua normalizeIdempotencyKey.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentDto'
      responses:
        '201':
          description: Ket qua xu ly thanh toan (ke ca khi PAYMENT_FAILED tra success=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/zalopay/create:
    post:
      tags: [Payments]
      summary: Tao giao dich ZaloPay Sandbox v2 cho don PENDING/PAYMENT_FAILED
      description: >-
        Tao giao dich thanh toan qua cong ZaloPay. He thong kiem tra quyen so huu (Order Ownership):
        chi nguoi tao don (order.userId === currentUser.id) moi co quyen tao thanh toan.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: integer, minimum: 1 }
      responses:
        '200': { description: URL thanh toan va appTransId }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Tu choi truy cap neu khong phai chu so huu don hang (order.userId !== currentUser.id)

  /payments/zalopay/callback:
    post:
      tags: [Payments]
      summary: Webhook IPN tu ZaloPay xac thuc chu ky HMAC-SHA256
      description: Kiem tra data va mac la chuoi khong rong (tra return_code -1 neu sai), xac thuc MAC Key2, chong trung appTransId xuyen don hang (409 -> return_code 1/0) va tu choi neu don da het han 15 phut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, mac]
              properties:
                data: { type: string }
                mac: { type: string }
                type: { type: integer }
      responses:
        '200':
          description: Ket qua IPN theo chuan ZaloPay `{ return_code, return_message }`

  /payments/zalopay/status/{orderId}:
    get:
      tags: [Payments]
      summary: Kiem tra trang thai giao dich ZaloPay cua don hang
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: appTransId
          schema: { type: string }
      responses:
        '200': { description: Trang thai thanh toan don hang }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Chi chu so huu don hang hoac STAFF/ADMIN moi co quyen xem trang thai thanh toan
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/zalopay/confirm:
    post:
      tags: [Payments]
      summary: Gia lap callback thanh cong cho ZaloPay Sandbox (production yeu cau ALLOW_SANDBOX_CONFIRM=true)
      description: Endpoint ho tro moi truong dev/sandbox de test xac nhan thanh toan ma khong can callback that. O moi truong production, endpoint bi chan 403 mac dinh (Default-Deny) tru khi bien moi truong ALLOW_SANDBOX_CONFIRM=true. Dong thoi kiem tra quyen so huu don hang.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: integer, minimum: 1 }
                appTransId: { type: string }
      responses:
        '200': { description: Xac nhan thanh toan sandbox thanh cong }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Bi chan mac dinh khi ALLOW_SANDBOX_CONFIRM=false hoac khong phai chu so huu don hang

  /payments/zalopay/cancel:
    post:
      tags: [Payments]
      summary: Huy giao dich ZaloPay Sandbox va hoan kho (production yeu cau ALLOW_SANDBOX_CONFIRM=true)
      description: Endpoint ho tro test huy giao dich va hoan 100% nguyen lieu BOM + voucher (khong thu hoi diem Hat Vang vi diem chi cong khi COMPLETED). O moi truong production, endpoint bi chan 403 mac dinh (Default-Deny) tru khi ALLOW_SANDBOX_CONFIRM=true. Kiem tra chu so huu don hang va kieu chuoi appTransId.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: integer, minimum: 1 }
      responses:
        '200': { description: Huy don va hoan nguyen vat lieu }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Bi chan mac dinh khi ALLOW_SANDBOX_CONFIRM=false hoac khong phai chu so huu don hang

  /inventory/pricing-config:
    get:
      tags: [Inventory]
      summary: Lay cau hinh phu thu size mac dinh (Public)
      responses:
        '200': { description: Cau hinh size S/M/L }

  /inventory/size-pricing:
    patch:
      tags: [Inventory]
      summary: Cap nhat cau hinh gia size S/M/L (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSizePricingDto' }
      responses:
        '200': { description: Cap nhat thanh cong }

  /inventory:
    get:
      tags: [Inventory]
      summary: Tong quan ton kho nguyen vat lieu (STAFF | ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach ton kho }

  /inventory/ingredients:
    get:
      tags: [Inventory]
      summary: Danh sach nguyen vat lieu (STAFF | ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach nguyen vat lieu }
    post:
      tags: [Inventory]
      summary: Them nguyen vat lieu moi (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIngredientDto' }
      responses:
        '201': { description: Tao thanh cong }

  /inventory/ingredients/{id}:
    patch:
      tags: [Inventory]
      summary: Cap nhat nguyen vat lieu (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIngredientDto' }
      responses:
        '200': { description: Cap nhat thanh cong }
    delete:
      tags: [Inventory]
      summary: Xoa nguyen vat lieu (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200': { description: Da xoa nguyen vat lieu thanh cong }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Khong the xoa nguyen vat lieu do da phat sinh lich su kho (InventoryLog) hoac cong thuc lien quan (onDelete Restrict)

  /inventory/ingredients/{id}/restock:
    patch:
      tags: [Inventory]
      summary: Nhap kho them nguyen vat lieu va ghi InventoryLog (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestockIngredientDto' }
      responses:
        '200': { description: Nhap kho thanh cong }

  /inventory/ingredients/{id}/stock:
    patch:
      tags: [Inventory]
      summary: Kiem ke dieu chinh ton kho tuyet doi (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIngredientStockDto' }
      responses:
        '200': { description: Dieu chinh thanh cong }

  /inventory/logs:
    get:
      tags: [Inventory]
      summary: Lich su bien dong kho (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach InventoryLog }

  /inventory/recipes:
    get:
      tags: [Inventory]
      summary: Danh sach dinh muc BOM cho mon va topping (STAFF | ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sach cong thuc }
    post:
      tags: [Inventory]
      summary: Them hoac cap nhat cong thuc BOM theo productId + size (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
