components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    NumericId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: Khoa chong trung lap don hang/thanh toan tu client (UUIDv4, chuan hoa qua normalizeIdempotencyKey, toi da 255 ky tu, tu choi gia tri khong phai chuoi voi 400, bo qua chuoi rong/khoang trang). Neu gui lai cung key voi cung payload, server tra ve ket qua da ton tai. Neu payload khac voi key da luu, server tra ve 409 Conflict.
      schema: { type: string, maxLength: 255 }
  responses:
    BadRequest: { description: Du lieu dau vao khong hop le hoac vi pham nghiep vu }
    Unauthorized: { description: Thieu hoac JWT khong hop le }
    Forbidden: { description: Khong du quyen truy cap hoac bi chan theo cau hinh moi truong }
    NotFound: { description: Khong tim thay tai nguyen }
    Conflict: { description: Xung dot trang thai / optimistic locking / trung du lieu }
    TooManyRequests: { description: Vuot gioi han tan suat (ThrottlerGuard) }
  schemas:
    Role:
      type: string
      enum: [CUSTOMER, STAFF, ADMIN]
    OrderStatus:
      type: string
      enum: [PENDING, PAID, PREPARING, READY, COMPLETED, PAYMENT_FAILED, CANCELLED]
    PaymentMethod:
      type: string
      enum: [EWALLET, BANK_CARD]
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED]
    RegisterDto:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 6, maxLength: 128, pattern: '.*\S.*', description: '@Matches(/\S/)' }
        fullName: { type: string, maxLength: 100, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        phone: { type: string, maxLength: 30 }
    LoginDto:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateProfileDto:
      type: object
      properties:
        fullName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }
        currentPassword: { type: string, maxLength: 128 }
        newPassword: { type: string, minLength: 6, maxLength: 128, pattern: '.*\S.*', description: '@Matches(/\S/)' }
    RedeemPointsDto:
      type: object
      required: [points, voucherCode]
      properties:
        points: { type: integer, minimum: 1, maximum: 2147483647 }
        voucherCode: { type: string, maxLength: 50, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        description: { type: string, maxLength: 200, description: '@NoUnsafeHtml()' }
    UserSafe:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        position: { type: string, nullable: true }
        isActive: { type: boolean }
        loyaltyPoints: { type: integer }
        createdAt: { type: string, format: date-time }
        vouchers:
          type: array
          items: { type: object }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/UserSafe' }
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        basePrice: { type: number }
        sizeUpchargeM: { type: number, nullable: true }
        sizeUpchargeL: { type: number, nullable: true }
        category: { type: string }
        tag: { type: string, nullable: true }
        isActive: { type: boolean }
        isSoldOutManual: { type: boolean }
        outOfStockSizes:
          type: array
          items: { type: string }
    CreateProductDto:
      type: object
      required: [name, basePrice]
      properties:
        name: { type: string, maxLength: 150, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        description: { type: string, maxLength: 1000 }
        imageUrl: { type: string, maxLength: 500, description: '@NoUnsafeHtml()' }
        basePrice: { type: integer, minimum: 0, maximum: 100000000 }
        sizeUpchargeM: { type: integer, minimum: 0, maximum: 100000000, nullable: true }
        sizeUpchargeL: { type: integer, minimum: 0, maximum: 100000000, nullable: true }
        category: { type: string, maxLength: 50, description: '@NoUnsafeHtml()' }
        tag: { type: string, maxLength: 50, description: '@NoUnsafeHtml()' }
        isActive: { type: boolean }
        isSoldOutManual: { type: boolean }
    UpdateProductDto:
      type: object
      properties:
        name: { type: string, maxLength: 150, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        description: { type: string, maxLength: 1000 }
        imageUrl: { type: string, maxLength: 500, description: '@NoUnsafeHtml()' }
        basePrice: { type: integer, minimum: 0, maximum: 100000000 }
        sizeUpchargeM: { type: integer, minimum: 0, maximum: 100000000, nullable: true }
        sizeUpchargeL: { type: integer, minimum: 0, maximum: 100000000, nullable: true }
        category: { type: string, maxLength: 50, description: '@NoUnsafeHtml()' }
        tag: { type: string, maxLength: 50, description: '@NoUnsafeHtml()' }
        isActive: { type: boolean }
        isSoldOutManual: { type: boolean }
    ToggleProductVisibilityDto:
      type: object
      properties:
        isActive: { type: boolean }
        isSoldOutManual: { type: boolean }
    ToggleSoldOutDto:
      type: object
      required: [isSoldOutManual]
      properties:
        isSoldOutManual:
          type: boolean
          description: true = het hang tam thoi (86), false = con hang / mo ban lai
    OrderItemDto:
      type: object
      required: [productId, size, toppings, quantity]
      properties:
        productId: { type: integer, minimum: 1, maximum: 2147483647 }
        productName: { type: string, maxLength: 150, description: '@NoUnsafeHtml()' }
        size: { type: string, enum: [S, M, L, ALL] }
        sugarLevel: { type: string, maxLength: 30, description: '@NoUnsafeHtml()' }
        iceLevel: { type: string, maxLength: 30, description: '@NoUnsafeHtml()' }
        temperature: { type: string, maxLength: 30, description: '@NoUnsafeHtml()' }
        notes: { type: string, maxLength: 500, description: '@NoUnsafeHtml()' }
        toppings:
          type: array
          maxItems: 10
          uniqueItems: true
          description: '@ArrayUnique (case-insensitive trimmed), @Matches(/\S/), @NoUnsafeHtml()'
          items: { type: string, maxLength: 50, pattern: '.*\S.*' }
        quantity: { type: integer, minimum: 1, maximum: 50 }
        unitPrice: { type: number, minimum: 0, maximum: 100000000 }
    CreateOrderDto:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderItemDto' }
        discountCode: { type: string, maxLength: 50 }
    UpdateOrderStatusDto:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
    CreatePaymentDto:
      type: object
      required: [orderId, method]
      properties:
        orderId: { type: integer, minimum: 1 }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        simulateFailure: { type: boolean }
    PaymentResponse:
      type: object
      properties:
        success: { type: boolean }
        paymentId: { type: integer }
        orderId: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { type: number }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        transactionId: { type: string }
        pointsEarned:
          type: integer
          description: Luon tra ve 0 tai buoc thanh toan PAID; diem Hat Vang duoc cong khi don dat trang thai COMPLETED qua PATCH /orders/{id}/status.
        isIdempotent: { type: boolean }
        message: { type: string }
    UpdateSizePricingDto:
      type: object
      required: [sizeS, sizeM, sizeL]
      properties:
        sizeS: { type: integer, minimum: 0, maximum: 100000000 }
        sizeM: { type: integer, minimum: 0, maximum: 100000000 }
        sizeL: { type: integer, minimum: 0, maximum: 100000000 }
    CreateIngredientDto:
      type: object
      required: [code, name, unit, stock, minThreshold]
      properties:
        code: { type: string, maxLength: 50, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        name: { type: string, maxLength: 150, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        unit: { type: string, maxLength: 30, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        stock: { type: number, minimum: 0, maximum: 100000000 }
        minThreshold: { type: number, minimum: 0, maximum: 100000000 }
        costPerUnit: { type: number, minimum: 0, maximum: 1000000000 }
        type: { type: string, enum: [INGREDIENT, PACKAGING] }
        isRequiredForSale: { type: boolean }
    UpdateIngredientDto:
      type: object
      properties:
        code: { type: string, maxLength: 50, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        name: { type: string, maxLength: 150, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        unit: { type: string, maxLength: 30, pattern: '.*\S.*', description: '@Matches(/\S/), @NoUnsafeHtml()' }
        stock: { type: number, minimum: 0, maximum: 100000000 }
        minThreshold: { type: number, minimum: 0, maximum: 100000000 }
        costPerUnit: { type: number, minimum: 0, maximum: 1000000000 }
        type: { type: string, enum: [INGREDIENT, PACKAGING] }
        isRequiredForSale: { type: boolean }
    RestockIngredientDto:
      type: object
      required: [addAmount]
      properties:
        addAmount: { type: number, minimum: 0.1, maximum: 100000000 }
        unitCost: { type: number, minimum: 0, maximum: 1000000000 }
        totalCost: { type: number, minimum: 0, maximum: 10000000000 }
        note: { type: string, maxLength: 500, description: '@NoUnsafeHtml()' }
    UpdateIngredientStockDto:
      type: object
