name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      TEST_DATABASE_URL: ${{ format('postgresql://postgres:postgres@localhost:5432/{0}', 'ci') }}
      MOCK_PAYMENT_MODE: success
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Generate Prisma client
        if: matrix.app == 'api'
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test

      - name: Build
        run: npm run build

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: quality
    if: always()
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "CI failed: quality result = ${{ needs.quality.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
